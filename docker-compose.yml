# Local development / staging stack.
#   docker compose --env-file .env up -d --build              # local-disk storage
#   STORAGE_BACKEND=s3 docker compose --profile s3 up -d      # S3 backend via MinIO
x-app-env: &app-env
  ENV: development
  LOG_LEVEL: INFO
  LOG_JSON: "false"
  REDIS_URL: redis://redis:6379/0
  PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-financial-scans}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
  PINECONE_API_KEY: ${PINECONE_API_KEY:?set PINECONE_API_KEY}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (see .env.example)}
  JWT_ISSUER: ${JWT_ISSUER:-}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-}
  REQUIRE_TENANT: ${REQUIRE_TENANT:-true}
  LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
  LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-financial-multimodal-rag}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_PATH: /app/data/store
  S3_BUCKET: ${S3_BUCKET:-rag-dev}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  SCRATCH_DIR: /tmp/rag-scratch
  TEXT_EXTRACTION: ${TEXT_EXTRACTION:-tesseract}
  METRICS_PORT: "9000"

services:
  redis:
    image: redis:7.4-alpine
    # noeviction: a broker must never silently drop queued tasks under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
      - "127.0.0.1:9100:9000"   # metrics, bound to localhost only
    environment: *app-env
    volumes:
      - rag_data:/app/data      # shared with the worker for the local backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    volumes:
      - rag_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional S3-compatible store for exercising STORAGE_BACKEND=s3 locally.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
             mc mb --ignore-existing local/$${S3_BUCKET:-rag-dev}"

volumes:
  rag_data:
  redis_data:
  minio_data:
