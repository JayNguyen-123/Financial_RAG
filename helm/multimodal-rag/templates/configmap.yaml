apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag.fullname" . }}-config
  labels:
    {{- include "rag.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if ne $key "REDIS_URL" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
  REDIS_URL: {{ include "rag.redisUrl" . | quote }}
  STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  {{- if eq .Values.storage.backend "s3" }}
  {{- if not .Values.storage.s3.bucket }}
  {{- fail "storage.s3.bucket is required when storage.backend=s3" }}
  {{- end }}
  S3_BUCKET: {{ .Values.storage.s3.bucket | quote }}
  S3_PREFIX: {{ .Values.storage.s3.prefix | quote }}
  S3_ENDPOINT_URL: {{ .Values.storage.s3.endpointUrl | quote }}
  S3_REGION: {{ .Values.storage.s3.region | quote }}
  {{- end }}
