{{- if and (eq .Values.storage.backend "local") (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rag.claimName" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete ingested crops on uninstall
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
