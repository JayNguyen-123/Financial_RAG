{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- range $k := list "OPENAI_API_KEY" "PINECONE_API_KEY" "JWT_SECRET" }}
{{- if not (index $v $k) }}
{{- fail (printf "secrets.values.%s is required when secrets.existingSecret is not set" $k) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag.secretName" . }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $v }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
