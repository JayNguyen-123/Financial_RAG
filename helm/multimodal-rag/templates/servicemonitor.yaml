{{- if .Values.telemetry.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rag.fullname" . }}-api
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    {{- with .Values.telemetry.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rag.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.telemetry.serviceMonitor.interval | default "15s" }}
      scrapeTimeout: {{ .Values.telemetry.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
